baseURL = 'https://retrofeel.org/'
locale = 'en-CA'
title = 'RetroFeel'
enableRobotsTXT = true
disableKinds = ['taxonomy', 'term', 'RSS']

[params]
repositoryURL = '' # Optional source link; leave empty while the repository is private.
description = 'Give your coding agent clearer playtest feedback. RetroFeel brings gameplay, input timing, and spoken notes together so you can explain what needs to change.'

[[module.mounts]]
source = 'static'
target = 'static'

[[module.mounts]]
source = '../apps/retrofeel/assets/fonts'
target = 'static/fonts'

[[module.mounts]]
source = 'assets'
target = 'assets'

[[module.mounts]]
source = '../LICENSE.md'
target = 'assets/legal/core-licenses.md'

[[module.mounts]]
source = '../LICENSE'
target = 'assets/legal/retrofeel-license.txt'

[markup.goldmark.renderer]
unsafe = false

[outputs]
home = ['HTML']
page = ['HTML']
