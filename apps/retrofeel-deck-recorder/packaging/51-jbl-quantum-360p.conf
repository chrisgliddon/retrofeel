# JBL Quantum 360P Console (0ecb:20ab) keeps SteamOS's stock ACP routing.
# Its generic analog-stereo Game PCM can report stale hardware pointers after
# resuming from idle, leaving PipeWire in a permanent XRUN.

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "alsa_output.usb-JBL_JBL_Quantum_360P_Console-00.analog-stereo"
      }
    ]
    actions = {
      update-props = {
        # Allow about 21 ms at 48 kHz for the receiver's pointers to settle.
        api.alsa.start-delay = 1024
      }
    }
  }
]
